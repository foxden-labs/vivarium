        { label: 'Block', value: 'block', kind: 'danger' }
      ], { accent: t.accent || 'var(--fox)' });
      if (!v) return;
      if (v === 'any') { g.sites = 'any'; g.sitesBlocked = false; }
      else if (v === 'ask') { g.sites = Array.isArray(g.sites) ? g.sites : []; g.sitesBlocked = false; }
      else { g.sites = []; g.sitesBlocked = true; }
      grantsChanged(t);
      again();
    });

    const nOn = g.notifications === 'granted';
    const nSub = nOn ? (osNotify === 'denied' ? 'Allowed here, but off in Android settings' : 'Allowed')
      : g.notifications === 'denied' ? 'Blocked' : 'Not asked yet';
    const notifyRow = row('bell', 'Notifications', nSub, async () => {
      g.notifications = nOn ? 'denied' : 'granted';
      if (!nOn) { await systemNotify(true); ensureToolIcon(t); }
      grantsChanged(t);
      again();
    }, nOn ? 'on' : '', sw());

    const bOn = g.background === 'granted';
    const w = wakes[t.id];
    const bSub = bOn ? (w ? 'Every ' + fmtEvery(w.every) + ' · last ' + fmtAgo(w.last) + ' · next ' + fmtIn(w.next) : 'Allowed, not scheduled')
      : g.background === 'denied' ? 'Blocked' : 'Not asked yet';
    const wakeRow = row('clock', 'Background', bSub, async () => {
      g.background = bOn ? 'denied' : 'granted';
      if (bOn) { delete wakes[t.id]; if (NATIVE && V) await V.clearWake({ id: t.id }).catch(() => {}); }
      grantsChanged(t);
      render();
      again();
    }, bOn ? 'on' : '', sw());

    const extra = [];
    if (bOn && w && NATIVE && V) extra.push(row('run', 'Wake it now', 'Runs it in the background once, as a test', () => {
      V.wakeNow({ id: t.id }).then(() => toast('Waking ' + t.name)).catch(() => toast('Could not wake it'));
    }));
    if (bOn && battery === false && NATIVE && V) extra.push(row('battery', 'Battery is restricted', 'Wake-ups may stop. Tap to allow Vivarium to run unrestricted', () => {
      V.openBatterySettings().catch(() => {});
    }, 'danger'));

    const any = g.sites || g.sitesBlocked || g.notifications || g.background;
    openSheet([
      el('div', { class: 'sheet-head' },
        el('div', { class: 'sheet-icon' }, iconNode(t)),
        el('div', { style: { minWidth: '0' } },
          el('div', { class: 'sheet-title' }, 'Permissions'),
          el('div', { class: 'sheet-host' }, t.name + ' · ' + t.id + HOST_SUFFIX))),
      el('div', { style: { borderTop: '1px solid var(--line-soft)' } },
        sitesRow, notifyRow, wakeRow, ...extra,
        any ? row('wipe', 'Reset permissions', 'Forget every answer; it asks again', async () => {
          t.grants = {};
          delete wakes[t.id];
          if (NATIVE && V) await V.clearWake({ id: t.id }).catch(() => {});
          grantsChanged(t);
          render();
          again();
        }, 'danger') : null)
    ], t.accent);
  }

  /* ═════════════════════════════════════════════════════════════════
     ANDROID: back button, shortcuts, incoming files
     ═════════════════════════════════════════════════════════════════ */

  function toolIdFromUrl(url) {
    const m = /^vivarium:\/\/tool\/([a-z0-9-]+)/.exec(url || '');
    return m ? m[1] : null;
  }
  // vivarium://tool/<id>?nc=1&tag=..&data=..&action=..  is a notification tap.
  let lastLink = { url: '', at: 0 };
  function clickFromUrl(url) {
    const q = String(url || '').split('?')[1];
    if (!q) return null;
    const p = new URLSearchParams(q);
    if (!p.get('nc')) return null;
    return { tag: p.get('tag') || '', data: p.get('data') || '', action: p.get('action') || '' };
  }
  function openLinkUrl(url) {
    const id = toolIdFromUrl(url);
    if (!id) return false;
    // Cold starts can hand the same link over twice.
    if (url === lastLink.url && Date.now() - lastLink.at < 4000) return true;
    lastLink = { url, at: Date.now() };
    openFromShortcut(id, clickFromUrl(url));
    return true;
  }

  async function openFromShortcut(id, click) {
    if (!byId(id)) { toast('That tool isn’t here anymore'); return; }
    if (toolSt && toolSt.t.id === id) {
      if (click) { if (toolSt.ready) tell(toolSt, Object.assign({ t: 'nclick' }, click)); else toolSt.click = click; }
      return;
    }
    if (popSt) popSt.close(null);
    closeSheet(true);
    if (toolSt) await leaveTool();
    lastX = innerWidth / 2; lastY = innerHeight / 2;
    openTool(id, null, { click });
  }

  function wireNative() {
    const App = plug('App');
    if (!NATIVE || !App) return;

    App.addListener('backButton', () => {
      if (popSt) { popSt.close(null); return; }
      if (sheetSt) { closeSheet(); return; }
      if (toolSt) { if (!toolSt.closing) history.back(); return; }
      App.minimizeApp();
    });

    App.addListener('appUrlOpen', (ev) => {
      if (!openLinkUrl(ev && ev.url)) sweepInbox();
    });

    App.addListener('appStateChange', (st) => {
      if (st && st.isActive) {
        sweepInbox();
        Promise.all([refreshWakes(), systemNotify(false)]).then(() => { if (!toolSt) render(); });
      }
      else if (toolSt) ask(toolSt, 'flush', 1500);   // backgrounded: save, just in case
    });

    // The scheduler found the open tool due: it gets the wake instead of a hidden copy.
    const V = plug('Vivarium');
    if (V && V.addListener) V.addListener('wake', (d) => {
      const S = toolSt;
      if (S && S.ready && d && S.t.id === d.id) tell(S, { t: 'wake', reason: 'schedule', network: d.network || null });
    });

    App.getLaunchUrl().then((r) => { openLinkUrl(r && r.url); }).catch(() => {});
  }

  /* ═════════════════════════════════════════════════════════════════
     BOOT
     ═════════════════════════════════════════════════════════════════ */

  (async function boot() {
    await loadLibrary();
    await Promise.all([refreshWakes(), systemNotify(false)]);
    render();
    wireNative();
    await sweepInbox();
    // Refresh what each tool holds, quietly, one at a time.
    if (NATIVE) for (const t of lib.tools.slice()) { if (toolSt) break; await probe(t.id); }
  })();
})();
</script>
</body>
</html>
